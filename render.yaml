services:
  - type: web
    name: telegram-ai-rewriter
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: REWRITE_STYLE
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
